---
# Tailscale on the comic machine: own address in the tailnet, reachable from anywhere without open router ports
# (ADR-0025). Joins with TAILSCALE_AUTHKEY from comics.env; without it the machine is only installed.
- name: Tailscale already installed?
  ansible.builtin.stat:
    path: /usr/bin/tailscale
  register: tailscale_bin

- name: Install Tailscale (skipped when it is already on the machine)
  when: not tailscale_bin.stat.exists
  block:
    - name: Tailscale apt key
      ansible.builtin.get_url:
        url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts.distribution_release }}.noarmor.gpg"
        dest: /usr/share/keyrings/tailscale-archive-keyring.gpg
        mode: "0644"

    - name: Tailscale apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/tailscale.list
        mode: "0644"
        content: >
          deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
          https://pkgs.tailscale.com/stable/ubuntu {{ ansible_facts.distribution_release }} main

    - name: Tailscale installed
      ansible.builtin.apt:
        name: tailscale
        state: present
        update_cache: true

- name: tailscaled running
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Already in the tailnet?
  ansible.builtin.command: tailscale status --json
  register: tailscale_state
  changed_when: false

- name: Read secrets file
  ansible.builtin.slurp:
    src: "{{ comics_env_file }}"
  register: tailscale_env_raw

- name: Parse auth key
  ansible.builtin.set_fact:
    tailscale_authkey: "{{ tailscale_env.TAILSCALE_AUTHKEY | default('') }}"
  vars:
    tailscale_env: >-
      {{ dict((tailscale_env_raw.content | b64decode).splitlines()
         | map('trim') | reject('match', '^(#|$)') | select('search', '=')
         | map('split', '=', 1)) }}
  no_log: true

- name: Join the tailnet
  when: (tailscale_state.stdout | from_json).BackendState != 'Running' and tailscale_authkey | length > 0
  ansible.builtin.command:
    argv: >-
      {{ ['tailscale', 'up', '--authkey=' ~ tailscale_authkey, '--hostname=' ~ comics_tailscale_hostname]
         + (['--ssh'] if comics_tailscale_ssh | bool else []) }}
  no_log: true
  changed_when: true

- name: Firewall - SSH and web from the tailnet, only on its own interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: tailscale0
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]
