---
- name: Read secrets file
  ansible.builtin.slurp:
    src: "{{ comics_env_file }}"
  register: comics_env_raw

- name: Parse secrets file
  ansible.builtin.set_fact:
    comics_env: >-
      {{ dict((comics_env_raw.content | b64decode).splitlines()
         | map('trim') | reject('match', '^(#|$)') | select('search', '=')
         | map('split', '=', 1)) }}
  no_log: true

- name: Secrets present?
  ansible.builtin.set_fact:
    comics_secrets_ready: "{{ (comics_env.N8N_ENCRYPTION_KEY | default('')) | length > 0 }}"

- name: Note missing secrets
  ansible.builtin.debug:
    msg: >-
      {{ comics_env_file }} is not filled in yet. K3s is running, but apps are only deployed after
      the secrets are in place (docs/INSTALL.md step 6) and `sudo comics-update` is run.
  when: not comics_secrets_ready

- name: Deploy apps
  when: comics_secrets_ready
  block:
    - name: Upload-only credentials for the scan sync
      ansible.builtin.copy:
        dest: /etc/comics/scan-upload.env
        owner: root
        mode: "0600"
        content: |
          AWS_ACCESS_KEY_ID={{ comics_env.SCAN_UPLOAD_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY={{ comics_env.SCAN_UPLOAD_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION={{ comics_env.AWS_REGION | default('eu-central-1') }}
          S3_BUCKET={{ comics_env.S3_BUCKET }}
      no_log: true

    - name: Backup credentials (same IAM user as the app)
      ansible.builtin.copy:
        dest: /etc/comics/backup.env
        owner: root
        mode: "0600"
        content: |
          AWS_ACCESS_KEY_ID={{ comics_env.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY={{ comics_env.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION={{ comics_env.AWS_REGION | default('eu-central-1') }}
          S3_BUCKET={{ comics_env.S3_BUCKET }}
      no_log: true

    - name: Build comic-helper image locally
      when: helper_build_local | bool
      block:
        - name: Podman for local image builds
          ansible.builtin.apt:
            name: podman
            state: present
        - name: Build image
          ansible.builtin.command:
            cmd: podman build -t {{ helper_image }} -f services/comic-helper/Containerfile .
            chdir: "{{ comics_repo_dir }}"
          changed_when: true
        - name: Import image into K3s containerd
          ansible.builtin.shell: |
            set -o pipefail
            podman save {{ helper_image }} | k3s ctr images import -
          args:
            executable: /bin/bash
          changed_when: true

    - name: Namespace
      ansible.builtin.command: k3s kubectl apply -f {{ comics_repo_dir }}/infra/k3s/base/namespace.yaml
      changed_when: false

    - name: Kubernetes secret from env file
      ansible.builtin.shell: |
        set -o pipefail
        k3s kubectl -n comics create secret generic comics-env \
          --from-env-file={{ comics_env_file }} --dry-run=client -o yaml \
          | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Apply manifests (kustomize)
      ansible.builtin.command: k3s kubectl apply -k {{ comics_repo_dir }}/infra/k3s
      register: apply_out
      changed_when: "'configured' in apply_out.stdout or 'created' in apply_out.stdout"

    - name: Restart comic-helper to pick up a freshly built image
      ansible.builtin.command: k3s kubectl -n comics rollout restart deployment/comic-helper
      when: helper_build_local | bool
      changed_when: true

    - name: Does the scan user exist?
      ansible.builtin.getent:
        database: passwd
        key: "{{ comics_scan_user }}"
      failed_when: false
      register: scan_user_entry

    - name: kubectl for the scan user (namespace comics only, ADR-0036)
      when: scan_user_entry.ansible_facts.getent_passwd is defined
      block:
        - name: Read service account token and CA
          ansible.builtin.shell: |
            set -o pipefail
            k3s kubectl -n comics get secret scan-operator-token -o jsonpath='{.data.token}{"\n"}{.data.ca\.crt}'
          args:
            executable: /bin/bash
          register: scan_operator_secret
          changed_when: false
          no_log: true
          until: scan_operator_secret.stdout.split('\n')[0] | length > 0
          retries: 10
          delay: 3

        - name: kube directory for the scan user
          ansible.builtin.file:
            path: "/home/{{ comics_scan_user }}/.kube"
            state: directory
            owner: "{{ comics_scan_user }}"
            group: "{{ comics_scan_user }}"
            mode: "0700"

        - name: Kubeconfig for the scan user (mode 600)
          ansible.builtin.copy:
            dest: "/home/{{ comics_scan_user }}/.kube/config"
            owner: "{{ comics_scan_user }}"
            group: "{{ comics_scan_user }}"
            mode: "0600"
            content: |
              apiVersion: v1
              kind: Config
              clusters:
                - name: comics
                  cluster:
                    server: https://127.0.0.1:6443
                    certificate-authority-data: {{ scan_operator_secret.stdout.split('\n')[1] }}
              users:
                - name: scan-operator
                  user:
                    token: {{ scan_operator_secret.stdout.split('\n')[0] | b64decode }}
              contexts:
                - name: comics
                  context: { cluster: comics, user: scan-operator, namespace: comics }
              current-context: comics
          no_log: true

    - name: Wait for rollouts
      ansible.builtin.command: k3s kubectl -n comics rollout status {{ item }} --timeout=600s
      loop: [statefulset/postgres, deployment/n8n, deployment/comic-helper]
      changed_when: false
