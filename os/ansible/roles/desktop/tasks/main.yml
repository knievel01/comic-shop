---
- name: Cinnamon desktop (ADR-0001)
  ansible.builtin.apt:
    name: [cinnamon-desktop-environment, gnome-terminal, lightdm, lightdm-gtk-greeter, firefox, evince, language-pack-de, xserver-xorg, dconf-cli]
    state: present
    install_recommends: false

- name: Scanner group (normally created by libsane1)
  ansible.builtin.group:
    name: scanner
    system: true

- name: Scan user
  ansible.builtin.user:
    name: "{{ comics_scan_user }}"
    shell: /bin/bash
    groups: [scanner, lp]
    append: true
    password: "!"

- name: Graphical boot target
  ansible.builtin.file:
    src: /lib/systemd/system/graphical.target
    dest: /etc/systemd/system/default.target
    state: link

- name: LightDM drop-in directory
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d
    state: directory
    mode: "0755"

- name: Auto-login for the scan user
  ansible.builtin.copy:
    dest: /etc/lightdm/lightdm.conf.d/50-comics-autologin.conf
    mode: "0644"
    content: |
      [Seat:*]
      autologin-user={{ comics_scan_user }}
      autologin-session=cinnamon
  when: comics_scan_autologin | bool

- name: No auto-login
  ansible.builtin.file:
    path: /etc/lightdm/lightdm.conf.d/50-comics-autologin.conf
    state: absent
  when: not (comics_scan_autologin | bool)

# Screen lock for the scan user: system-wide dconf default (the user db still wins, nobody changed it there).
- name: dconf profile reads the system database
  ansible.builtin.lineinfile:
    path: /etc/dconf/profile/user
    line: "{{ item }}"
    create: true
    mode: "0644"
  loop: [user-db:user, system-db:local]
  notify: Update dconf

- name: dconf database directory
  ansible.builtin.file:
    path: /etc/dconf/db/local.d
    state: directory
    mode: "0755"

- name: No screen lock (scan station)
  ansible.builtin.copy:
    dest: /etc/dconf/db/local.d/50-comics-screenlock
    mode: "0644"
    content: |
      [org/cinnamon/desktop/screensaver]
      lock-enabled=false

      [org/cinnamon/settings-daemon/plugins/power]
      lock-on-suspend=false
  when: not (comics_scan_screenlock | bool)
  notify: Update dconf

- name: Screen lock as default again
  ansible.builtin.file:
    path: /etc/dconf/db/local.d/50-comics-screenlock
    state: absent
  when: comics_scan_screenlock | bool
  notify: Update dconf
