---
- name: Installed K3s version
  ansible.builtin.command: k3s --version
  register: k3s_installed
  changed_when: false
  failed_when: false

- name: Install K3s {{ k3s_version }}
  when: k3s_version not in (k3s_installed.stdout | default(''))
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"
        force: true
    - name: Run K3s installer (pinned version)
      ansible.builtin.command: /tmp/k3s-install.sh
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: >-
          server
          --write-kubeconfig-mode 0600
          --default-local-storage-path /var/lib/comics/k3s-storage
          --disable-cloud-controller
      changed_when: true

- name: K3s running and enabled at boot (power loss recovery)
  ansible.builtin.systemd_service:
    name: k3s
    state: started
    enabled: true

- name: Wait for node Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=300s
  changed_when: false

- name: Kubeconfig for admin user
  ansible.builtin.file:
    path: "/home/{{ comics_admin_user }}/.kube"
    state: directory
    owner: "{{ comics_admin_user }}"
    mode: "0700"

- name: Copy kubeconfig (mode 600)
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ comics_admin_user }}/.kube/config"
    remote_src: true
    owner: "{{ comics_admin_user }}"
    mode: "0600"

- name: KUBECONFIG for root shells
  ansible.builtin.copy:
    dest: /etc/profile.d/comics-kube.sh
    mode: "0644"
    content: |
      [ "$(id -u)" = 0 ] && export KUBECONFIG=/etc/rancher/k3s/k3s.yaml
      [ "$(id -un)" = "{{ comics_scan_user }}" ] && export KUBECONFIG="$HOME/.kube/config"
