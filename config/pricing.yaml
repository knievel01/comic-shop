# Zentrale fachliche Konfiguration. Sepp kann diese Werte anhand echter Verkäufe nachjustieren.
# Änderung: Datei anpassen, committen, auf dem Rechner `sudo comics-update --tags apps`.
# Herleitung und Quellen: docs/PREISFINDUNG.md

# Comicguide-Zustandsskala 0–4. Faktor bezogen auf den Preis für Zustand 1.
# Beschreibungen in eigenen Worten (nicht von Comicguide übernommen), werden im Review-Formular
# und im Shop angezeigt.
zustaende:
  0:
    bezeichnung: perfekt
    faktor: 1.5
    hilfe: Wie neu, ungelesen wirkend. Keine Knicke, keine Stoßstellen, Farben voll.
  1:
    bezeichnung: sehr gut
    faktor: 1.0
    hilfe: Gelesen, aber sehr gepflegt. Höchstens winzige Gebrauchsspuren an Kanten oder Rücken.
  2:
    bezeichnung: gut
    faktor: 0.4
    hilfe: Deutliche Lesespuren, leichte Knicke oder Rückenbruch, kleine Flecken. Vollständig.
  3:
    bezeichnung: noch sammelwürdig
    faktor: 0.2
    hilfe: Stärkere Mängel wie Risse, Stempel, Verfärbung, lose Klammern. Vollständig.
  4:
    bezeichnung: zum Wegwerfen zu schade
    faktor: 0.1
    hilfe: Starke Schäden, aber noch lesbar und vollständig. Unvollständige Hefte nicht über den Shop.

# Sepps Aufschlag auf den Comicguide-Preis
aufschlag: 1.5
# Abweichender Aufschlag je Preisquelle. Booklooker-Angebote sind bereits Endkundenpreise (ADR-0028).
aufschlag_je_quelle:
  booklooker: 1.0

# Sammelposten (ADR-0026): mehrere gleiche Hefte als ein Artikel mit Menge > 1 und Zustandsbereich (z. B. 1–3).
# Preisfaktor aus den Faktoren aller Zustände im Bereich: mittelwert | schlechtester | bester
sammelposten:
  preisregel: mittelwert
  max_anzahl: 999

# Noch lieferbare Titel: Basis Z1 = Coverpreis × Faktor (Comicguide-Praxis: 2/3)
coverpreis:
  faktor: 0.6667
  # Regel nur anwenden, wenn der Coverpreis in Euro ist und das Heft höchstens so alt ist
  waehrung: EUR
  max_alter_jahre: 3

# Rundung auf glatte Shop-Preise: nächstgelegener Preis mit einer dieser Endungen
rundung:
  endungen: [0.50, 0.99]
  modus: naechste        # naechste | aufrunden
  mindestpreis: 2.00

# KI-Erkennung: ab dieser Gesamtsicherheit "sicher", darunter "Nachkontrolle"
konfidenz_schwelle: 0.80

# Erlaubte Preisquellen (werden als S3-Metadatum gespeichert)
preisquellen: [booklooker, comicguide, coverpreis, katalog, manuell]
# Im Formular vorausgewählt: booklooker, bis eine Comicguide-Lizenz vorliegt (ADR-0028)
standard_preisquelle: booklooker
# Quellen, bei denen ein Beleg (Link auf das Angebot) Pflicht ist
beleg_pflicht: [booklooker]

# Direktlinks im Review-Formular. {q} = URL-kodierter Suchtext "Titel Untertitel".
# Nur Links für die Fachkraft, kein automatischer Abruf (Comicguide verbietet Data Mining).
suchlinks:
  Comicguide: https://www.comicguide.de/search?search={q}
  ZVAB: https://www.zvab.com/servlet/SearchResults?kn={q}
  Booklooker: https://www.booklooker.de/B%C3%BCcher/Angebote/titel={q}
  GCD: https://www.comics.org/searchNew/?q={q}

# Automatischer Preisvorschlag (ADR-0022): Median gebrauchter Angebote bei Booklooker/ZVAB, gefunden per
# Anthropic-Websuche (kein eigener Abruf dieser Seiten, ADR-0028). Aus = nur Coverpreis-Vorschlag.
marktpreis:
  aktiv: true
  min_angebote: 2     # weniger belegte Angebote -> kein Vorschlag
  max_suchen: 4       # Websuchen je Comic (Kostenbremse)
  versuche: 2         # zweiter Anlauf, wenn der erste zu wenige Angebote liefert
  max_tokens: 16000   # Obergrenze je Antwort; zu knapp (4000) schneidet bei Haiku die Antwort ab, bevor sie fertig ist
  modell: ""          # leer = CLAUDE_MODEL (Erkennung); z. B. claude-sonnet-5-5 für die Preissuche

shopify:
  # ACTIVE = sofort sichtbar (sofern Vertriebskanal veröffentlicht), DRAFT = erst prüfen.
  # Erste Woche nach dem Go-Live DRAFT, danach ACTIVE (ADR-0028). Änderung zuerst in der Sandbox (ADR-0027).
  produkt_status: DRAFT
  produkt_typ: Comic
  hersteller_aus_verlag: true

# Statistik-Seiten /review/statistik: Kosten der KI-Aufrufe und eingesparte Zeit.
statistik:
  modellpreise_usd:        # USD je Million Token (Eingabe, Ausgabe), Stand 2026-11-04
    claude-opus-5-5: [4.0, 20.0]
    claude-sonnet-5-5: [2.0, 10.0]
    claude-haiku-5-5: [0.1, 0.5]
  websuche_usd: 0.01       # je Websuche
  # ANNAHME, nicht gemessen: so viele Minuten spart jeder Lauf des Workflows gegenüber Handarbeit.
  # Die Token-Kosten fallen trotzdem an und stehen auf der Kosten-Seite.
  gespart_minuten_je_lauf:
    erkennung: 4           # Workflow 01: Cover/Rückseite lesen, Angaben und Preis recherchieren
    shopify: 4             # Workflow 02: Produkt in Shopify anlegen
  stundensatz_eur: 14.60   # Arbeitskosten je Stunde; gesparte Minuten × Stundensatz = eingesparte Kosten
  # Messung vom 2026-11-04 (8 Comics, je 1 Lauf, scripts/preissuche-vergleich.py), Preissuche mit dem neuen Prompt.
  # Aktuell im Einsatz: Opus. Die Kosten der anderen Modelle erscheinen in Klammern.
  preissuche_vergleich:
    claude-opus-5-5:   {abweichung: "–", usd: 0.29, sekunden: 18, angebote: "5 bis 8", vorschlaege: "7 von 8"}
    claude-sonnet-5-5: {abweichung: "Ø 6 % (max. 18 %)", usd: 0.21, sekunden: 17, angebote: "5 bis 8", vorschlaege: "7 von 8"}
    claude-haiku-5-5:  {abweichung: "Ø 23 % (max. 80 %)", usd: 0.03, sekunden: 35, angebote: "2 bis 8", vorschlaege: "8 von 8"}
