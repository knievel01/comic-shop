# Outbound-only tunnel for Shopify webhooks. No inbound port on the router needed.
# In the Cloudflare dashboard (Zero Trust -> Networks -> Tunnels -> Public hostnames):
#   hostname: hooks.<domain>   path: ^/webhook/   service: http://n8n.comics.svc.cluster.local:5678
# Everything else on that hostname returns 404, the n8n editor is never exposed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.10.4
          args: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
          env:
            - name: TUNNEL_TOKEN
              valueFrom: { secretKeyRef: { name: cloudflared, key: token } }
          livenessProbe:
            httpGet: { path: /ready, port: 2000 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
