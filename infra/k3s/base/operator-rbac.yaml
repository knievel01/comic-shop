# kubectl access for the station user "scan" (ADR-0036): admin rights inside namespace comics only,
# nothing cluster-wide (no nodes, no other namespaces). The kubeconfig is written by the role apps.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: scan-operator
---
apiVersion: v1
kind: Secret
metadata:
  name: scan-operator-token
  annotations:
    kubernetes.io/service-account.name: scan-operator
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scan-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
  - kind: ServiceAccount
    name: scan-operator
