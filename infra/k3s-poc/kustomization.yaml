# Feasibility PoC on an existing, shared K3s (not the comic machine, see docs/POC.md).
# Differences to the base:
# - ingress only for the host pro-mini.fritz.box and plain http (entrypoint web): the
#   shared Traefik serves other hosts (paperless), so no catch-all rule. Reachable by every
#   device in the LAN, no ufw in front of Traefik (ADR-0008/0009 assume the dedicated machine).
# - namespace label, so `poc-host-k3s.sh delete` only removes the PoC namespace.
# - comic-helper comes from the local registry on localhost:5000 (no sudo needed),
#   pulled on every start so a rebuilt image with the same tag is picked up.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: comics
resources:
  - ../k3s
  - registry.yaml
images:
  - name: localhost/comic-helper
    newName: localhost:5000/comic-helper
patches:
  - target:
      kind: Deployment
      name: comic-helper
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      kind: Ingress
      name: comics
    patch: |-
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.entrypoints
        value: web
      - op: add
        path: /spec/rules/0/host
        value: pro-mini.fritz.box
  # Plain http (Traefik in front, or port-forward without proxy): no secure cookie.
  - target:
      kind: Deployment
      name: n8n
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: n8n
      spec:
        template:
          spec:
            containers:
              - name: n8n
                env:
                  - { name: N8N_SECURE_COOKIE, value: "false" }
  - target:
      kind: Namespace
      name: comics
    patch: |-
      - op: add
        path: /metadata/labels
        value:
          app.kubernetes.io/part-of: comics-poc
