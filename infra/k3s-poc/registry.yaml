# PoC only: local image registry so comic-helper can be loaded into K3s without sudo
# (`k3s ctr images import` needs root). Host network, bound to 127.0.0.1:5000 only:
# docker on the host pushes there, K3s containerd pulls from localhost:5000 over plain http.
# No auth, no persistence; after a restart run `scripts/poc-host-k3s.sh build` again.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate     # host port, never two at once
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      hostNetwork: true
      containers:
        - name: registry
          image: docker.io/library/registry:2.8.3
          env:
            - { name: REGISTRY_HTTP_ADDR, value: "127.0.0.1:5000" }
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
          readinessProbe:
            httpGet: { host: 127.0.0.1, path: /v2/, port: 5000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          emptyDir: {}
