{# Upload form, used on /review/hochladen and in the "+" dialog of the list (ADR-0018) #}
<style>
  form.upload label { display:block; font-weight:800; font-size:1.1rem; margin:1rem 0 .35rem; }
  form.upload input[type=file] { width:100%; font:inherit; padding:.55rem; border:2px dashed var(--ink); background:var(--soft); cursor:pointer; }
  form.upload input[type=file]::file-selector-button { font:800 1rem var(--text); margin-right:.8rem; padding:.4rem .8rem;
    border:2px solid var(--ink); background:var(--yellow); color:var(--ink); cursor:pointer; }
  form.upload small { color:var(--muted); display:block; margin-top:.5rem; font-size:.95rem; }
  form.upload .aktionen { display:flex; gap:.8rem; margin-top:1.4rem; flex-wrap:wrap; }
  form.upload button { padding:.65rem 1.5rem .5rem; font:1.45rem/1 var(--display); letter-spacing:.05em; cursor:pointer;
    border:var(--panel); background:var(--red); color:var(--paper); text-shadow:1px 1px 0 var(--ink); box-shadow:4px 4px 0 var(--ink); }
  form.upload button:active { transform:translate(3px, 3px); box-shadow:1px 1px 0 var(--ink); }
  form.upload button.zweit { background:var(--paper); color:var(--ink); text-shadow:none; }
  .vorschau { display:flex; gap:1rem; margin-top:1rem; }
  .vorschau img { max-height:160px; max-width:45%; border:var(--panel); box-shadow:4px 4px 0 var(--ink); }
</style>
<form class="upload" method="post" action="/review/hochladen" enctype="multipart/form-data" id="upload">
  <label for="cover">Cover (Seite 1)</label>
  <input type="file" name="cover" id="cover" accept="{{ upload_typen }}" required>
  <label for="rueckseite">Rückseite (Seite 2)</label>
  <input type="file" name="rueckseite" id="rueckseite" accept="{{ upload_typen }}" required>
  <small>JPEG, PNG, WebP oder AVIF, höchstens 25 MB je Bild. Möglichst gerade von oben und ohne Spiegelungen.</small>
  <div class="vorschau"><img id="v-cover" alt="" hidden><img id="v-rueckseite" alt="" hidden></div>
  <div class="aktionen">
    <button type="submit" id="senden">Hochladen</button>
    {% if abbrechen %}<button type="button" class="zweit" id="abbrechen">Abbrechen</button>{% endif %}
  </div>
</form>
<script>
for (const id of ["cover", "rueckseite"]) {
  document.getElementById(id).addEventListener("change", e => {
    const img = document.getElementById("v-" + id), f = e.target.files[0];
    if (f) { img.src = URL.createObjectURL(f); img.hidden = false; } else { img.hidden = true; }
  });
}
document.getElementById("upload").addEventListener("submit", () => {
  const b = document.getElementById("senden"); b.disabled = true; b.textContent = "Wird hochgeladen …";
});
</script>
