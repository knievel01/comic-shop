<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Comics prüfen{% endblock %}</title>
<style>
  :root { --ink:#1d1d1f; --muted:#6b6b70; --line:#d9d9de; --ok:#1f7a3a; --warn:#a15c00; --bad:#b3261e; --accent:#2350a8; }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.45 system-ui, sans-serif; color:var(--ink); background:#f6f6f8; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:.6rem 1.2rem; display:flex; gap:1rem; align-items:center; }
  header a { color:var(--accent); text-decoration:none; font-weight:600; }
  main { padding:1.2rem; max-width:1500px; margin:0 auto; }
  .badge { display:inline-block; padding:.05rem .5rem; border-radius:1rem; font-size:.8rem; font-weight:600; }
  .sicher { background:#e3f3e7; color:var(--ok); } .nachkontrolle { background:#fff0d9; color:var(--warn); }
  .fehler, .status-fehler { background:#fde7e5; color:var(--bad); }
  h2 { font-size:1rem; margin:1.6rem 0 .4rem; color:var(--muted); font-weight:600; }
  h2 .badge { font-size:.95rem; margin-right:.3rem; }
  .status-neu, .status-in-arbeit { background:#ececf0; color:var(--muted); }
  .status-offen { background:#e4ebfa; color:var(--accent); } .status-bestaetigt { background:#e3f3e7; color:var(--ok); }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { text-align:left; padding:.5rem .7rem; border-bottom:1px solid var(--line); vertical-align:middle; }
  .msg { padding:.7rem 1rem; border-radius:.4rem; margin-bottom:1rem; }
  .msg.err { background:#fde7e5; color:var(--bad); } .msg.ok { background:#e3f3e7; color:var(--ok); }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header><a href="/review/">Offene Comics</a><a href="/review/hochladen">Hochladen</a><span style="color:var(--muted)">Scannen → Prüfen → Shop</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
